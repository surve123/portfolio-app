spring.application.name=portfolio-server
server.port=${PORT:5000}

# --- Gmail SMTP (Nodemailer's Java equivalent: JavaMailSender) ---
# You MUST use a Gmail "App Password", not your normal Gmail password:
#   1. Turn on 2-Step Verification: https://myaccount.google.com/security
#   2. Create an App Password: https://myaccount.google.com/apppasswords
#   3. Set MAIL_USERNAME / MAIL_PASSWORD as environment variables (see README).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast instead of hanging when the host blocks outbound SMTP.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Resend HTTP API (https://resend.com) ---
# Render's free tier blocks outbound SMTP, so in production email is sent over
# HTTPS via Resend instead. When RESEND_API_KEY is set it takes priority over
# the SMTP settings above; leave it unset locally to keep using Gmail SMTP.
app.contact.resend-api-key=${RESEND_API_KEY:}

# Where contact-form messages should be delivered.
app.contact.to-email=${TO_EMAIL:shreyassurve02@gmail.com}

# Comma-separated list of allowed client origins in production, e.g.:
# APP_CORS_ALLOWED_ORIGINS=https://shreyas-surve-portfolio.vercel.app
# Leave unset ("*") for local development.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
